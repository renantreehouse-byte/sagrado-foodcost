<script>
{
const IGV=0.18, KEY='foodcost-sagrado-v2';
const BRAND={nombre:'Sagrado',tag:'Restaurante · Plaza de Armas, Cusco',color:'#1f4d36',logo:''};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const n=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0};
const r1=x=>Math.round(x*10)/10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfq=new Intl.NumberFormat('es-PE',{maximumFractionDigits:3});
const S_=v=>'S/ '+nf2.format(v);
const P=v=>nf2.format(v*100).replace(/0$/,'')+'%';
const Q=v=>nfq.format(v);
let S, tab='resumen', snap=null, tTimer;

/* ---------- cálculos ---------- */
const insById=id=>S.insumos.find(i=>i.id===id);
const mf=i=>1/(1-Math.min(Math.max(n(i.merma),0),99)/100);
const aprov=i=>n(i.costo)*mf(i);
const costoRec=r=>r.items.reduce((s,it)=>{const i=insById(it.ins);return s+(i?n(it.cant)*aprov(i):0)},0);
const neto=r=>S.igv?n(r.precio)/(1+IGV):n(r.precio);
const fc=r=>{const p=neto(r);return p>0?costoRec(r)/p:0};
const meta=()=>n(S.meta)/100;
const sug=r=>{const m=meta();if(m<=0)return 0;const pn=costoRec(r)/m;return S.igv?pn*(1+IGV):pn};
const cls=f=>{const m=n(S.meta);const p=f*100;return p<=m?'ok':p<=m+5?'warn':'bad'};
function consTeor(){const t={};S.recetas.forEach(r=>{const u=n(S.ventas[r.id]);r.items.forEach(it=>{const i=insById(it.ins);if(i)t[i.id]=(t[i.id]||0)+u*n(it.cant)*mf(i)})});return t}
function totals(){
 const teor=consTeor();let ventas=0,costoT=0,uds=0;
 S.recetas.forEach(r=>{const u=n(S.ventas[r.id]);uds+=u;ventas+=u*neto(r);costoT+=u*costoRec(r)});
 let costoR=0;
 const filas=S.insumos.map(i=>{const v=S.inv[i.id]||{};const real=n(v.ini)+n(v.comp)-n(v.fin);const t=teor[i.id]||0;const c=n(i.costo);costoR+=real*c;return{i,real,t,du:real-t,ds:(real-t)*c,vr:real*c,vt:t*c}});
 return{ventas,costoT,costoR,uds,fcT:ventas?costoT/ventas:0,fcR:ventas?costoR/ventas:0,filas};
}

 const ins=[['Lomo de res','kg',58,12],['Cebolla roja','kg',3.5,10],['Tomate','kg',4,8],['Papa amarilla','kg',4.5,18],['Arroz','kg',4.2,0],['Pescado (corvina)','kg',45,35],['Limón','kg',6,50],['Ají amarillo','kg',8,25],['Gallina (pechuga)','kg',16,30],['Leche evaporada','L',7.5,0],['Camote','kg',3,15],['Culantro','kg',10,30],['Aceite vegetal','L',9,0],['Maíz morado','kg',7,0],['Piña','kg',4,40],['Azúcar','kg',3.8,0],['Trucha','kg',22,40],['Lomo de alpaca','kg',38,15],['Quinua','kg',9,0],['Queso fresco','kg',22,0],['Choclo','kg',3.5,45],['Rocoto','kg',6,20],['Mantequilla','kg',32,0],['Pisco quebranta','L',45,0],['Huevo','und',0.6,0]];
 const insumos=ins.map(([nombre,unidad,costo,merma])=>({id:uid(),nombre,unidad,costo,merma}));
 const by=x=>insumos.find(i=>i.nombre===x).id;
 const rec=[
  ['Lomo saltado',48,[['Lomo de res',.18],['Cebolla roja',.08],['Tomate',.08],['Papa amarilla',.2],['Arroz',.1],['Aceite vegetal',.03],['Ají amarillo',.01],['Culantro',.005]]],
  ['Ceviche clásico',45,[['Pescado (corvina)',.16],['Limón',.12],['Cebolla roja',.06],['Ají amarillo',.01],['Camote',.1],['Choclo',.08],['Culantro',.005]]],

const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const xn=v=>{if(typeof v==='number')return v;let s=String(v??'').replace(/[^0-9.,-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else s=s.replace(',','.');return n(s)};
async function readRows(file){

function mapCols(rows,spec,need){
 for(let r=0;r<Math.min(rows.length,15);r++){
  const h=rows[r].map(norm),m={},used=new Set();
  for(const[k,re]of Object.entries(spec)){const i=h.findIndex((x,j)=>!used.has(j)&&re.test(x));if(i>=0){m[k]=i;used.add(i)}}
  if(need.every(k=>k in m))return{m,start:r+1};
 }
 return null;
}
const SPEC_INS={nombre:/^(insumo|nombre|producto|descripcion|articulo|item|ingrediente)/,costo:/^(costo|precio)/,unidad:/^(unidad|und|um|u\.m|medida)/,merma:/merma/,ini:/inicial/,comp:/^compra/,fin:/final/};

function importInsumos(rows,mode){
 const c=mapCols(rows,SPEC_INS,['nombre','costo']);
 if(!c)throw new Error('No encontré las columnas "Insumo" y "Costo de compra" en las primeras filas de la hoja.');
 const {m}=c,seen=new Set();let nuevos=0,act=0;
 for(const row of rows.slice(c.start)){
  const nom=String(row[m.nombre]??'').trim();if(!nom)continue;
  let i=S.insumos.find(x=>norm(x.nombre)===norm(nom));
  if(!i){i={id:uid(),nombre:nom,unidad:'kg',costo:0,merma:0};S.insumos.push(i);S.inv[i.id]={ini:0,comp:0,fin:0};nuevos++}else if(!seen.has(i.id))act++;
  seen.add(i.id);
  i.costo=xn(row[m.costo]);
  if('unidad'in m&&String(row[m.unidad]).trim())i.unidad=String(row[m.unidad]).trim();
  if('merma'in m){let v=xn(row[m.merma]);if(v>0&&v<1)v*=100;i.merma=r1(v*10)/10}
  const inv=S.inv[i.id]||(S.inv[i.id]={ini:0,comp:0,fin:0});
  for(const k of['ini','comp','fin'])if(k in m&&row[m[k]]!=='')inv[k]=xn(row[m[k]]);
 }
 let quitados=0;
 if(mode==='replace'){const out=S.insumos.filter(i=>!seen.has(i.id));quitados=out.length;S.insumos=S.insumos.filter(i=>seen.has(i.id));out.forEach(i=>delete S.inv[i.id]);S.recetas.forEach(r=>r.items=r.items.filter(it=>seen.has(it.ins)))}
 if(!seen.size)throw new Error('La hoja no tiene filas con insumos.');
 return `${seen.size} insumos leídos: ${act} actualizados, ${nuevos} nuevos${quitados?`, ${quitados} eliminados`:''}.`;
}

 if(!Object.keys(suma).length)throw new Error('La hoja no tiene filas de ventas.');
 if(mode==='replace')S.recetas.forEach(r=>S.ventas[r.id]=0);
 let ok=0,tot=0;pend=[];

/* ---------- Resumen ---------- */
function rResumen(){
 const T=totals(), dev=(T.fcR-T.fcT)*100, devS=T.costoR-T.costoT;
 const top=T.filas.filter(f=>f.ds>0.005).sort((a,b)=>b.ds-a.ds).slice(0,3);
 const lista=top.length?`<ol>${top.map(f=>`<li><b>${esc(f.i.nombre)}</b>: ${Q(f.du)} ${esc(f.i.unidad)} de más · <b class="bad">${S_(f.ds)}</b></li>`).join('')}</ol>`:'<p>No hay insumos con consumo real mayor al teórico.</p>';
 const alerta=dev>1
  ?`<div class="alert bad"><h2>El consumo real supera al teórico en ${nf2.format(dev)} puntos de food cost</h2><p>Se usaron ${S_(devS)} más de lo que indican las recetas para lo vendido. Revisa porciones, mermas no registradas, robos o errores de inventario en estos 3 insumos con mayor desvío:</p>${lista}</div>`
  :`<div class="alert ok"><h2>Consumo real dentro de la tolerancia (${dev>=0?'+':''}${nf2.format(dev)} pp)</h2><p>La diferencia entre consumo real y teórico no supera 1 punto de food cost. Insumos con mayor desvío:</p>${lista}</div>`;
 const k=(l,v,s,c='')=>`<div class="kpi"><span>${l}</span><b class="${c}">${v}</b><small>${s}</small></div>`;
 const mb=T.ventas-T.costoR;
 const kpis=`<div class="kpis">
  ${k('Ventas netas',S_(T.ventas),`${Q(T.uds)} unidades · ${S.igv?'sin IGV':'precios sin IGV'}`)}
  ${k('Food cost teórico',P(T.fcT),S_(T.costoT)+' según recetas',cls(T.fcT))}
  ${k('Food cost real',P(T.fcR),S_(T.costoR)+' según inventario',cls(T.fcR))}
  ${k('Desviación real vs teórico',(dev>=0?'+':'')+nf2.format(dev)+' pp',(devS>=0?'Pérdida de ':'Ahorro de ')+S_(Math.abs(devS)),dev>1?'bad':dev>0?'warn':'ok')}
  ${k('Margen bruto real',S_(mb),(T.ventas?P(mb/T.ventas):'0%')+' de las ventas netas',mb<0?'bad':'')}</div>`;
 const fcs=S.recetas.map(fc), m=n(S.meta);
 const max=Math.max(10,Math.ceil(Math.max(m,...fcs.map(f=>f*100))*1.15/10)*10);
 const L=m/max*100;
 const bars=`<div class="card"><h2>Food cost por plato</h2><p class="sub">Costo teórico de la receta sobre el precio neto. La línea punteada marca la meta.</p>
  <div class="bars"><div class="brow head"><span></span><div class="track"><span class="mtag" style="left:${L}%">Meta ${nf2.format(m).replace(/,00$/,'')}%</span></div><span></span></div>
  ${S.recetas.map((r,i)=>`<div class="brow"><span class="bl" title="${esc(r.nombre)}">${esc(r.nombre)}</span><div class="track"><div class="bar ${cls(fcs[i])}" style="width:${Math.min(100,fcs[i]*100/max*100)}%"></div><div class="ml" style="left:${L}%"></div></div><span class="bv ${cls(fcs[i])}">${P(fcs[i])}</span></div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--ok)"></i>En meta o por debajo</span><span><i style="background:var(--acc)"></i>Hasta 5 pp sobre la meta</span><span><i style="background:var(--bad)"></i>Más de 5 pp sobre la meta</span></div></div>`;
 const tabla=`<div class="card"><h2>Detalle por plato</h2><p class="sub">El precio sugerido es el precio de carta${S.igv?' (con IGV)':''} que lleva el plato exactamente a la meta de food cost.</p>
  <table class="stack"><thead><tr><th>Plato</th><th class="n">Precio carta</th><th class="n">Precio neto</th><th class="n">Costo porción</th><th class="n">Food cost</th><th class="n">Margen unit.</th><th class="n">Vendidas</th><th class="n">Ventas netas</th><th class="n">Precio sugerido</th></tr></thead><tbody>
  ${S.recetas.map(r=>{const f=fc(r),c=costoRec(r),p=neto(r),s=sug(r),d=s-n(r.precio);return`<tr><td><b>${esc(r.nombre)}</b></td><td class="n">${S_(n(r.precio))}</td><td class="n">${S_(p)}</td><td class="n">${S_(c)}</td><td class="n"><span class="pill ${cls(f)}">${P(f)}</span></td><td class="n">${S_(p-c)}</td><td class="n">${Q(n(S.ventas[r.id]))}</td><td class="n">${S_(n(S.ventas[r.id])*p)}</td><td class="n"><b>${S_(s)}</b> <small class="${d>0?'bad':'ok'}">${d>0?'+':''}${nf2.format(d)}</small></td></tr>`}).join('')}
  </tbody></table></div>`;
 $('#p-resumen').innerHTML=alerta+kpis+bars+tabla;
}

function uRecetas(){
 const r=S.recetas.find(x=>x.id===S.sel);if(!r||!$('#rc'))return;
 const c=costoRec(r),p=neto(r),f=fc(r),s=sug(r);
 r.items.forEach((it,k)=>{const i=insById(it.ins),v=i?n(it.cant)*aprov(i):0;const u=$('#iu-'+k);if(!u)return;u.textContent=i?i.unidad:'';$('#ic-'+k).textContent=S_(v);$('#ip-'+k).textContent=c?P(v/c):'0%'});
 $('#itot').textContent=S_(c);
 const e=$('#rfc');e.textContent=P(f);e.className='big '+cls(f);
 $('#rfcn').textContent='Food cost · meta '+n(S.meta)+'%';
 $('#rc').textContent=S_(c);$('#rp').textContent=S_(p);

 $('#rs').textContent=S_(s);

 ${S.recetas.map(r=>`<tr><td><b>${esc(r.nombre)}</b></td><td class="n">${S_(neto(r))}</td><td><input type="number" step="1" min="0" inputmode="numeric" data-t="venta" data-id="${r.id}" value="${n(S.ventas[r.id])}" aria-label="Unidades de ${esc(r.nombre)}"></td><td class="n" id="vv-${r.id}"></td><td class="n" id="vc-${r.id}"></td></tr>`).join('')}

 <div class="scroll"><table class="minw2"><thead><tr><th style="width:17%">Insumo</th><th>Und</th><th class="n">Inv. inicial</th><th class="n">Compras</th><th class="n">Inv. final</th><th class="n">Consumo real</th><th class="n">Consumo teórico</th><th class="n">Dif. unidades</th><th class="n">Dif. S/</th></tr></thead><tbody>
 ${S.insumos.map(i=>{const v=S.inv[i.id]||(S.inv[i.id]={ini:0,comp:0,fin:0});const f=x=>`<td><input type="number" step="any" min="0" inputmode="decimal" data-t="inv" data-id="${i.id}" data-f="${x}" value="${n(v[x])}" aria-label="${x} ${esc(i.nombre)}" style="min-width:84px"></td>`;return`<tr><td><b>${esc(i.nombre)}</b></td><td>${esc(i.unidad)}</td>${f('ini')}${f('comp')}${f('fin')}<td class="n" id="cr-${i.id}"></td><td class="n" id="ct-${i.id}"></td><td class="n" id="cu-${i.id}"></td><td class="n" id="cs-${i.id}"></td></tr>`}).join('')}
 </tbody><tfoot><tr><td colspan="5">Total valorizado</td><td class="n" id="ctr"></td><td class="n" id="ctt"></td><td></td><td class="n" id="cts"></td></tr></tfoot></table></div>
 <p class="note">En rojo: se consumió más de lo que justifican las ventas (pérdida). En verde: consumo menor al teórico, revisa si las porciones salen cortas.</p></div>`;
 uVentas();

function uVentas(){

 S.recetas.forEach(r=>{const u=n(S.ventas[r.id]);tu+=u;const a=$('#vv-'+r.id);if(a){a.textContent=S_(u*neto(r));$('#vc-'+r.id).textContent=S_(u*costoRec(r))}});
 if(!$('#vtu'))return;
 $('#vtu').textContent=Q(tu);$('#vtv').textContent=S_(T.ventas);$('#vtc').textContent=S_(T.costoT);
 T.filas.forEach(f=>{const id=f.i.id;if(!$('#cr-'+id))return;
  $('#cr-'+id).textContent=Q(f.real);$('#ct-'+id).textContent=Q(f.t);
  const c=f.ds>0.005?'bad':f.ds<-0.005?'ok':'';

 $('#ctr').textContent=S_(T.costoR);$('#ctt').textContent=S_(T.costoT);
 const d=T.costoR-T.costoT,e=$('#cts');e.textContent=(d>0?'+':'')+S_(d);e.className='n '+(d>0.005?'bad':'ok');

 else if(a==='delIns'){const i=insById(b.dataset.id);keep(`Insumo "${i.nombre}" eliminado`);S.insumos=S.insumos.filter(x=>x.id!==i.id);delete S.inv[i.id];S.recetas.forEach(x=>x.items=x.items.filter(it=>it.ins!==i.id));changed(true)}
 else if(a==='addRec'){const id=uid();S.recetas.push({id,nombre:'Nueva receta',precio:0,items:[]});S.ventas[id]=0;S.sel=id;changed(true);const el=document.querySelector('[data-t="rec"][data-f="nombre"]');if(el){el.focus();el.select()}}
 else if(a==='delRec'&&r){keep(`Receta "${r.nombre}" eliminada`);S.recetas=S.recetas.filter(x=>x.id!==r.id);delete S.ventas[r.id];S.sel=S.recetas[0]?.id;changed(true)}
 else if(a==='addItem'&&r&&S.insumos.length){r.items.push({ins:S.insumos[0].id,cant:0});changed(true);const q=document.querySelectorAll('[data-t="item"][data-f="cant"]');q[q.length-1]?.focus()}
 else if(a==='delItem'&&r){r.items.splice(+b.dataset.k,1);changed(true)}
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='uNew')return;e.preventDefault();
 const nombre=$('#nNom').value.trim(),email=$('#nMail').value.trim().toLowerCase(),password=$('#nPass').value,rol=$('#nRol').value,btn=$('#nBtn');
 if(!nombre)return uMsg('nMsg','Escribe el nombre.','bad');
 if(!okMail(email))return uMsg('nMsg','Escribe un correo válido.','bad');
 if(password.length<8)return uMsg('nMsg','La contraseña debe tener al menos 8 caracteres.','bad');
 btn.disabled=true;btn.textContent='Creando…';
 try{await api('crear',{nombre,email,password,rol});e.target.reset();uMsg('nMsg',`Usuario creado: ${email} (${ROLES[rol]}). Entrégale su contraseña temporal.`);await loadUsers()}
 catch(err){uMsg('nMsg',err.message,'bad')}
 finally{btn.disabled=false;btn.textContent='Crear usuario'}
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
init();
}
